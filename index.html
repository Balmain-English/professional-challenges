<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dce4ea">
  <meta name="description" content="Explore interactive English challenges from the Balmain English Learning Library.">
  <title>English Challenges | Balmain English Learning Library</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #203348;
      --muted: #586b7c;
      --ice: #e8eef2;
      --silver: #d7e0e6;
      --paper: #f9fbfc;
      --line: #c1ccd4;
      --blue: #42637d;
      --blue-dark: #29465e;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 18% 0%, rgba(255,255,255,.98), transparent 42%),
        linear-gradient(135deg, #f3f6f8 0%, #dce4e9 48%, #edf1f4 100%);
      font: 15px/1.55 "Segoe UI", Arial, sans-serif;
    }
    .shell { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
    .masthead {
      color: #fff;
      background: linear-gradient(110deg, #1d3043, #344e64 58%, #263c51);
      border-bottom: 1px solid rgba(255,255,255,.45);
      box-shadow: 0 4px 18px rgba(27, 45, 61, .18);
    }
    .masthead-inner { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: .02em; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid #c9d5de;
      border-radius: 4px;
      color: #f4f8fa;
      font: 1.15rem Georgia, serif;
      box-shadow: inset 0 1px rgba(255,255,255,.3);
    }
    .library-label { color: #d9e3ea; font-size: .82rem; }
    main { padding: 38px 0 48px; }
    .panel {
      position: relative;
      overflow: hidden;
      padding: clamp(30px, 6vw, 66px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(255,255,255,.88), rgba(235,241,245,.94) 48%, rgba(248,250,251,.9));
      box-shadow: 0 16px 42px rgba(35, 54, 70, .14), inset 0 1px 0 #fff;
    }
    .panel::before {
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: linear-gradient(90deg, #b9c9d4, #fff 35%, #93a9b8 70%, #e8eef2);
      content: "";
    }
    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: .73rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font: 600 clamp(2.1rem, 5vw, 3.5rem)/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.03em; }
    .lede { max-width: 660px; margin: 13px 0 0; color: var(--muted); font-size: 1.02rem; }
    .collection { margin-top: 42px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 17px; }
    .section-title { margin: 0; font: 600 1.2rem Georgia, "Times New Roman", serif; }
    .count { margin-left: 8px; color: var(--muted); font: 500 .78rem "Segoe UI", Arial, sans-serif; }
    .search {
      width: min(310px, 100%);
      min-height: 43px;
      padding: 9px 13px;
      border: 1px solid #aebdc8;
      border-radius: 5px;
      background: rgba(255,255,255,.86);
      color: var(--ink);
      font: inherit;
      box-shadow: inset 0 1px 2px rgba(31, 51, 68, .06);
    }
    .search::placeholder { color: #657887; }
    .search:focus-visible { outline: 3px solid rgba(66, 99, 125, .3); outline-offset: 2px; border-color: var(--blue); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 0; margin: 0; list-style: none; }
    .grid li { min-width: 0; }
    .exercise {
      display: flex;
      min-height: 108px;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 18px 14px;
      border: 1px solid #aebdc8;
      border-radius: 6px;
      background: linear-gradient(155deg, #fff 0%, #eef2f5 50%, #dce4e9 100%);
      box-shadow: 0 3px 8px rgba(37, 57, 73, .10), inset 0 1px 0 rgba(255,255,255,.95);
      color: var(--ink);
      text-decoration: none;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .exercise:hover {
      transform: translateY(-3px);
      border-color: #7892a5;
      background: linear-gradient(155deg, #fff 0%, #e7edf1 50%, #d2dde4 100%);
      box-shadow: 0 8px 17px rgba(37, 57, 73, .16), inset 0 1px 0 #fff;
    }
    .exercise:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .exercise-title { font-size: 1rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
    .exercise-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 9px; border-top: 1px solid rgba(105, 127, 144, .25); color: #526777; font-size: .77rem; }
    .open { color: var(--blue-dark); font-weight: 700; white-space: nowrap; }
    .message { grid-column: 1 / -1; padding: 22px; border: 1px dashed #9eafbb; border-radius: 6px; background: rgba(255,255,255,.62); color: var(--muted); text-align: center; }
    footer { padding: 18px 0 24px; color: #536675; font-size: .78rem; text-align: center; }
    @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } main { padding-top: 25px; } }
    @media (max-width: 560px) {
      .shell { width: calc(100% - 28px); }
      .masthead-inner { min-height: 58px; }
      .panel { padding: 32px 20px; }
      .toolbar { align-items: stretch; flex-direction: column; gap: 12px; }
      .search { width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .collection { margin-top: 32px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } .exercise:hover { transform: none; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>Balmain English</span></div>
      <div class="library-label">Learning Library</div>
    </div>
  </header>
  <main class="shell">
    <div class="panel">
      <section aria-labelledby="page-title">
        <p class="eyebrow">Challenge yourself</p>
        <h1 id="page-title">English Challenges</h1>
        <p class="lede">Explore interactive exercises and put your English skills into practice. New challenges added to this collection will appear here automatically.</p>
      </section>
      <section class="collection" aria-label="English challenge directory">
        <div class="toolbar">
          <h2 class="section-title">Choose a challenge <span class="count" id="count" aria-live="polite">Loading…</span></h2>
          <input id="search" class="search" type="search" placeholder="Search challenges" aria-label="Search English challenges">
        </div>
        <ul id="items" class="grid" aria-live="polite" aria-busy="true"></ul>
      </section>
    </div>
  </main>
  <footer><div class="shell">Balmain English · Learning Library</div></footer>
  <script>
    (() => {
      const owner = 'Balmain-English';
      const repo = 'challenges';
      const branch = 'main';
      const list = document.getElementById('items');
      const search = document.getElementById('search');
      const count = document.getElementById('count');
      let pages = [];

      const titleOf = path => path.split('/').pop()
        .replace(/\.html?$/i, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, character => character.toUpperCase());

      function render() {
        const query = search.value.trim().toLowerCase();
        const visible = pages.filter(page => page.title.toLowerCase().includes(query) || page.path.toLowerCase().includes(query));
        count.textContent = `${visible.length} ${visible.length === 1 ? 'challenge' : 'challenges'}`;
        list.replaceChildren();

        if (!visible.length) {
          const item = document.createElement('li');
          item.className = 'message';
          item.textContent = pages.length ? 'No challenges match your search.' : 'No challenges are available yet. Check back soon.';
          list.append(item);
          return;
        }

        const fragment = document.createDocumentFragment();
        visible.forEach(page => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.className = 'exercise';
          link.href = './' + page.path.split('/').map(encodeURIComponent).join('/');
          const title = document.createElement('span');
          title.className = 'exercise-title';
          title.textContent = page.title;
          const meta = document.createElement('span');
          meta.className = 'exercise-meta';
          const kind = document.createElement('span');
          kind.textContent = 'Interactive exercise';
          const open = document.createElement('span');
          open.className = 'open';
          open.textContent = 'Open challenge ↗';
          meta.append(kind, open);
          link.append(title, meta);
          item.append(link);
          fragment.append(item);
        });
        list.append(fragment);
      }

      fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Unable to load challenges');
          return response.json();
        })
        .then(data => {
          pages = (data.tree || [])
            .filter(file => file.type === 'blob' && /\.html?$/i.test(file.path) && !/^index\.html?$/i.test(file.path.split('/').pop()))
            .map(file => ({ path: file.path, title: titleOf(file.path) }))
            .sort((a, b) => a.title.localeCompare(b.title));
          list.setAttribute('aria-busy', 'false');
          render();
        })
        .catch(() => {
          count.textContent = 'Challenges unavailable';
          list.setAttribute('aria-busy', 'false');
          const message = document.createElement('li');
          message.className = 'message';
          message.textContent = 'Unable to load challenges right now. Please try again later.';
          list.replaceChildren(message);
        });

      search.addEventListener('input', render);
    })();
  </script>
</body>
</html>
